# 基本 CI: Rust workspace の整形・lint・テストと、apps/desktop のフロントエンドの typecheck・lint・単体テスト・ビルド。
# E2E は別のワークフロー(e2e-browser.yml / e2e-webview.yml)で扱う。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust stable を導入
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust のビルドキャッシュ
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 26 を導入
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 依存関係を導入
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: 単体テスト
        run: npm test

      - name: ビルド
        run: npm run build
