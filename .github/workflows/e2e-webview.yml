# 本 spec(desktop-gui-e2e-webview)の E2E スイート。Windows で実配布形(WebView2 の実アプリ)を検証する。
# job は 1 つだけ。初期の運用では非必須(continue-on-error)で、失敗を結果に表示するが CI 全体やプルリクエストの取り込みは妨げない。
# 基本 CI(Rust と フロントエンドの build / lint / test)とブラウザのスイートの CI(e2e-browser.yml)は変更しない。
# 必須への昇格の条件: main で連続 10 回成功したら continue-on-error を外し、必須チェックへの登録を検討する(apps/desktop/README.md に記載)。
name: e2e-webview

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/brainfuck-gui-api/**"
      - "crates/brainfuck-core/**"
      - "examples/hello.bf"
      - ".github/workflows/e2e-webview.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/brainfuck-gui-api/**"
      - "crates/brainfuck-core/**"
      - "examples/hello.bf"
      - ".github/workflows/e2e-webview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-webview:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 26 を導入
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust stable を導入
        uses: dtolnay/rust-toolchain@stable

      - name: Rust のビルドキャッシュ(実アプリの独立ワークスペース)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: WebView2 の Evergreen ランタイムを導入
        shell: pwsh
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
          $install = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WebView2 の導入が終了コード $($install.ExitCode) で終わりました" }

      - name: WebView2 の版を job の summary に記録
        id: webview2
        shell: pwsh
        continue-on-error: true
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'webview2-runtime.json'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./e2e/support/webview/windowsHost.ps1 -Action runtime > $out
          if ($LASTEXITCODE -ne 0) { throw "WebView2 の版の取得に失敗しました" }
          $result = Get-Content -Raw -LiteralPath $out | ConvertFrom-Json
          $version = if ($null -eq $result.webView2Version) { '取得できませんでした(版が無い)' } else { $result.webView2Version }
          "### WebView2 Runtime`n`n- 版: $version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 依存関係を導入
        run: npm ci

      - name: 実アプリの debug ビルド(準備)
        run: npm run e2e:webview:prepare

      # 診断(一時的な変更。原因が分かったら取り除く): 実アプリを 20 秒起動して、CDP の口(9333)が応答しない原因を記録する。
      # 結果は job の summary と artifact(wv-diag)に残す。実アプリはこのステップの最後に終了させる。
      - name: 診断(一時)実アプリの起動と CDP の口の状態を記録
        id: wv-diag
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $diag = Join-Path $env:RUNNER_TEMP 'wv-diag'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $exe = Join-Path (Get-Location) 'src-tauri/target/debug/brainfuck-studio.exe'

          # 1. 環境の記録
          $env_lines = @()
          $env_lines += '== exe'
          if (Test-Path -LiteralPath $exe) { $env_lines += "exists: true, size: $((Get-Item -LiteralPath $exe).Length) ($exe)" } else { $env_lines += "exists: false ($exe)" }
          $env_lines += '== WebView2 runtime (pv)'
          $pv = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          $env_lines += "pv: $pv"
          $env_lines += '== OS'
          $env_lines += (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List | Out-String)
          $env_lines += '== quser'
          $env_lines += (quser 2>&1 | Out-String)
          $env_lines += '== query session'
          $env_lines += (query session 2>&1 | Out-String)
          $env_lines += "UserInteractive: $([Environment]::UserInteractive)"
          $env_lines += "SESSIONNAME: $env:SESSIONNAME"
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $env_lines += "PrimaryMonitorSize: $([System.Windows.Forms.SystemInformation]::PrimaryMonitorSize)"
          } catch { $env_lines += "PrimaryMonitorSize error: $($_.Exception.Message)" }
          $env_lines | Out-File -FilePath (Join-Path $diag 'env.txt') -Encoding utf8

          # 2. 実アプリの起動(WebView2 の利用者データを一時フォルダに分け、CDP の口を 9333 に開く)
          $udir = Join-Path $env:RUNNER_TEMP 'diag-ud'
          New-Item -ItemType Directory -Force -Path $udir | Out-Null
          $env:WEBVIEW2_USER_DATA_FOLDER = $udir
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
          $app = $null
          try { $app = Start-Process -FilePath $exe -PassThru } catch { "Start-Process error: $($_.Exception.Message)" | Out-File -FilePath (Join-Path $diag 'start-error.txt') -Encoding utf8 }
          Start-Sleep -Seconds 20

          # 3. 待った後の状態の記録
          $run_lines = @()
          if ($null -eq $app) {
            $run_lines += 'app: 起動できませんでした'
          } else {
            $app.Refresh()
            $run_lines += "HasExited: $($app.HasExited)"
            if (-not $app.HasExited) {
              try { $run_lines += "Responding: $($app.Responding)" } catch { $run_lines += "Responding error: $($_.Exception.Message)" }
              $run_lines += "MainWindowTitle: '$($app.MainWindowTitle)'"
              $run_lines += "MainWindowHandle: $($app.MainWindowHandle)"
            }
          }
          $all = Get-CimInstance Win32_Process
          $tree = New-Object System.Collections.Generic.List[object]
          if ($null -ne $app) {
            $queue = New-Object System.Collections.Generic.Queue[int]
            $seen = @{}
            $queue.Enqueue([int]$app.Id)
            while ($queue.Count -gt 0) {
              $parent = $queue.Dequeue()
              if ($seen.ContainsKey($parent)) { continue }
              $seen[$parent] = $true
              foreach ($child in ($all | Where-Object { $_.ParentProcessId -eq $parent })) {
                $tree.Add($child)
                $queue.Enqueue([int]$child.ProcessId)
              }
            }
          }
          $wv = @($all | Where-Object { $_.Name -like 'msedgewebview2*' -and $_.CommandLine -like "*$udir*" })
          $run_lines += '== 子孫のプロセス(アプリの子孫)'
          foreach ($p in $tree) { $run_lines += "pid=$($p.ProcessId) ppid=$($p.ParentProcessId) name=$($p.Name) cmd=$($p.CommandLine)" }
          $run_lines += "== msedgewebview2(利用者データ '$udir' を含むもの): $($wv.Count) 件"
          foreach ($p in $wv) { $run_lines += "pid=$($p.ProcessId) ppid=$($p.ParentProcessId) name=$($p.Name) remote-debugging-port=$($p.CommandLine -match '--remote-debugging-port') user-data-dir=$($p.CommandLine -match '--user-data-dir')" }
          $run_lines += '== netstat -ano (9333)'
          $run_lines += (netstat -ano | Select-String -Pattern ':9333\s' | ForEach-Object { $_.Line })
          $run_lines += '== http://127.0.0.1:9333/json/version'
          try {
            $resp = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:9333/json/version' -TimeoutSec 5
            $run_lines += "status: $($resp.StatusCode)"
            $run_lines += $resp.Content
          } catch { $run_lines += "error: $($_.Exception.Message)" }
          $run_lines += '== Application event log(エラーと警告。直近 30 件のうち)'
          try {
            foreach ($e in (Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction Stop | Where-Object { $_.LevelDisplayName -in @('Error', 'Warning') })) {
              $first = ($e.Message -split "`r?`n")[0]
              $run_lines += "[$($e.TimeCreated)] $($e.ProviderName) id=$($e.Id) $($e.LevelDisplayName): $first"
            }
          } catch { $run_lines += "Get-WinEvent error: $($_.Exception.Message)" }
          $run_lines += "== 利用者データのフォルダ '$udir'"
          if (Test-Path -LiteralPath $udir) {
            foreach ($f in (Get-ChildItem -LiteralPath $udir -Recurse -Force -ErrorAction SilentlyContinue)) { $run_lines += $f.FullName.Substring($udir.Length) }
          } else { $run_lines += 'フォルダが無い' }
          $run_lines | Out-File -FilePath (Join-Path $diag 'run.txt') -Encoding utf8

          # 4. スクリーンショット(失敗しても続ける)
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $diag 'screen.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose()
            $bmp.Dispose()
          } catch { "screenshot error: $($_.Exception.Message)" | Out-File -FilePath (Join-Path $diag 'screen-error.txt') -Encoding utf8 }

          # 5. アプリのプロセスツリーを終了する
          if ($null -ne $app -and -not $app.HasExited) { & taskkill /PID $app.Id /T /F }

          # 6. job の summary に要点を書く
          "### 診断(一時): 実アプリの起動と CDP の口" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "~~~text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -LiteralPath (Join-Path $diag 'env.txt') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -LiteralPath (Join-Path $diag 'run.txt') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "~~~" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # 診断の出力を保存する(成功・失敗にかかわらず)
      - name: 診断(一時)の出力を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wv-diag
          path: ${{ runner.temp }}/wv-diag
          if-no-files-found: warn
          retention-days: 14

      # 元の内容(診断の後に戻す): npm run e2e:webview:run
      # 診断(一時): 起動のシナリオ 1 件だけを実行し、CDP の口の待ちの上限を 20 秒にする
      - name: webview の E2E
        env:
          E2E_APP_READY_MS: "20000"
        run: npm run e2e:webview:run -- e2e/webview/smoke-01-startup.webview.spec.ts --retries=0

      # 失敗時の調査用の出力(HTML レポート、各シナリオの test-results。スクリーンショット・実アプリのログを含む)を保存する
      - name: 失敗時の出力を保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-webview-output
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
