# 本 spec(desktop-gui-e2e-browser)の E2E スイート。Linux で実行する。
# 基本 CI(Rust のテスト・lint・整形、フロントエンドの単体テスト・lint)は別のワークフローで扱い、ここには含めない。
name: e2e-browser

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 26 を導入
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust stable を導入
        uses: dtolnay/rust-toolchain@stable

      - name: Rust のビルドキャッシュ
        uses: Swatinem/rust-cache@v2

      - name: 依存関係を導入
        run: npm ci

      - name: Playwright のブラウザのキャッシュ
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json') }}

      - name: Chromium と依存パッケージを導入
        run: npx playwright install --with-deps chromium

      - name: 日本語フォントを導入
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: E2E の準備(dist・シム・ブリッジ)
        run: npm run e2e:prepare

      - name: E2E(通常の検証。失敗で job を失敗にする)
        id: e2e
        run: npm run e2e:run -- --project=chromium

      # 通常の検証が失敗しても計測は実行する(計測の結果を残すため)。計測の報告は別の出力先に書き、通常の報告を上書きしない
      - name: E2E(時間計測。失敗しても job は失敗にしない)
        id: perf
        if: always()
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-perf
        run: npm run e2e:run -- --project=perf

      - name: 失敗時の出力を保存
        if: ${{ failure() || steps.perf.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-browser-output
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: 計測の実測値を保存
        if: ${{ always() && steps.perf.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-browser-perf
          path: apps/desktop/playwright-report-perf/
          if-no-files-found: ignore
          retention-days: 14
